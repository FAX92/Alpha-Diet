@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap');
:root{
  --ink:#17342b; --forest:#0c5a44; --jade:#147a5c; --jade2:#1b8a68; --mint:#e2f3ea; --mintline:#bfe3cf;
  --paper:#f4f9f6; --card:#fff; --line:#dbe4de; --sub:#71807a; --gold:#b8871c; --goldbg:#fdf3dc; --goldline:#f0dfae;
  --sky:#23527c; --skybg:#e3edf8; --skyline:#c5d9ee; --clay:#b8503c; --claybg:#fbeae7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.3}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.hero{background:linear-gradient(115deg,var(--forest) 0%,var(--jade) 70%,var(--jade2) 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 16px;border-radius:0 0 18px 18px}
.hero .row{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.5px;line-height:1}
.brandsub{font-size:12.5px;color:#d7ece4;margin-top:3px}
.ring{position:relative;width:56px;height:56px}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.ring circle.fg{transition:stroke-dasharray .5s ease}
.toggle{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:space-between;border-radius:14px;padding:8px 12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.toggle.on{background:rgba(255,255,255,.16)}
.toggle .lbl{font-size:13px;font-weight:600}
.knob{width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.3);position:relative;transition:background .2s}
.knob:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:999px;background:#fff;transition:left .2s,background .2s}
.toggle.on .knob{background:#fff}.toggle.on .knob:after{left:20px;background:var(--forest)}
.hint{font-size:11px;color:#d7ece4;margin-top:5px}
.pad{padding:0 16px}
.status{margin:12px 16px 0;border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px}
.status.open{background:var(--mint);color:var(--forest)}.status.fast{background:var(--skybg);color:var(--sky)}.status.closed{background:var(--claybg);color:var(--clay)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 16px 0;overflow:hidden}
.card.done{border-color:var(--mintline);box-shadow:inset 0 0 0 1px var(--mintline)}
.chead{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}.ttl{min-width:0}
.tpill{background:var(--forest);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.ttl{font-weight:700;font-size:15px;flex:1}
.badge{border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.green{background:var(--mint);color:var(--forest);border:1px solid var(--mintline)}
.badge.gold{background:var(--goldbg);color:var(--gold);border:1px solid var(--goldline)}
.badge.sky{background:var(--skybg);color:var(--sky);border:1px solid var(--skyline)}
.note{padding:0 12px 4px;font-size:11.5px;color:var(--gold);font-weight:600}
.items{padding:0 8px 8px}
.item{width:100%;display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;text-align:left;transition:transform .06s}
.item:active{transform:scale(.985)}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;transition:background .15s,border-color .15s}
.item.on .box{background:var(--jade);border-color:var(--jade)}
.item .n{display:block;font-size:14px;font-weight:600}
.item.on .n{color:var(--sub);text-decoration:line-through}
.item .q{display:block;font-size:11.5px;color:var(--sub)}
.sec{padding:12px}
.sec h3{font-weight:700;font-size:15px}
.sec .sub{font-size:11.5px;color:var(--sub);margin-top:2px}
.between{display:flex;align-items:baseline;justify-content:space-between}
.water{display:flex;gap:6px;margin-top:12px}
.seg{flex:1;height:42px;border-radius:8px;border:2px solid var(--skyline);background:var(--skybg);transition:background .15s}
.seg.train{border-style:dashed}
.seg.on{background:var(--sky);border-color:var(--sky)}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;font-size:15px;background:#fff}
.field:focus{outline:2px solid var(--jade);outline-offset:1px}
.rowg{display:flex;gap:8px;margin-top:10px}
.btn{border-radius:14px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--forest);color:#fff}
.btn.ghost{border:1.5px solid var(--line)}
.btn.danger{border:1.5px solid var(--clay);color:var(--clay)}
.btn.dangerfill{background:var(--clay);color:#fff}
.small{font-size:12px;color:var(--sub);margin-top:6px}
.banner{margin:12px 16px 0;border-radius:14px;padding:12px 16px;text-align:center;background:var(--ink);color:#eaf5ef;font-weight:700;font-size:15px;animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pin{text-align:center;font-size:11px;color:var(--sub);margin:12px 16px 0}
.bars{display:flex;align-items:flex-end;gap:4px;height:72px;margin-top:12px}
.bars div{flex:1;border-radius:4px;background:var(--line);transition:height .3s}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:4px}
.wlist div{display:flex;justify-content:space-between;font-size:12.5px;border-top:1px dashed var(--line);padding:4px 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(244,249,246,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:480px;margin:0 auto;display:flex}
.nav button{flex:1;padding:12px 0;font-weight:700;font-size:14px;color:var(--sub);border-top:3px solid transparent}
.nav button.act{color:var(--forest);border-top-color:var(--forest)}
.hidden{display:none}
textarea.field{resize:vertical;min-height:58px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav"><div class="in">
  <button id="tabToday" class="act" onclick="setTab('today')">Today</button>
  <button id="tabProgress" onclick="setTab('progress')">Progress</button>
</div></nav>

<script>
/* ===================== data ===================== */
const ROTATION = [
  {p:"Your pick · repeat a favorite",kcal:"~540"},
  {p:"Sockeye salmon · 185g",kcal:"~590",note:"no Cholula, no EVOO today"},
  {p:"Chicken breast · 185g",kcal:"~510"},
  {p:"Lean beef · 185g",kcal:"~560"},
  {p:"Pork loin centre cut · 185g",kcal:"~540"},
  {p:"Shrimp · 185g",kcal:"~430"},
  {p:"Your pick · repeat a favorite",kcal:"~540"},
];
function buildMeals(dow, training){
  return [
    {id:"wake",time:"06h30",title:"Wake stack",badge:"before the window",tone:"sky",items:[
      {id:"synthroid",n:"Synthroid 150mcg",q:"empty stomach · 30 to 60 min before food"},
      {id:"compounds",n:"Personal compounds",q:"wake + 45 · per your separate protocol"},
      {id:"bottle1",n:"Bottle 1 opens",q:"sip through the morning"}]},
    {id:"bowl",time:"08h00",title:"Cream of Rice Bowl",badge:"~415 kcal · 42g P",tone:"green",items:[
      {id:"elev8",n:"Elev8 Creamy Rice · 1 scoop (40g dry)",q:"cook with water · 117 kcal"},
      {id:"iso1",n:"VRAC ISO dark chocolate · 1 scoop (30g)",q:"stir in OFF the heat · 27g protein"},
      {id:"eggs",n:"Whole eggs · 2, on the side",q:"the day's fat floor · never whites only"},
      {id:"blueb",n:"Blueberries · ½ cup (~75g)",q:"daily · fresh or Kirkland frozen"}]},
    {id:"lunch",time:"12h30",title:"Lunch · plate, round 1",badge:"~505 kcal · 63g P",tone:"green",items:[
      {id:"chicken",n:"Chicken breast · 185g cooked",q:"305 kcal · 57g protein"},
      {id:"rice1",n:"Jasmine rice · 125g cooked",q:"weighed cooked, the scale decides"},
      {id:"veg1",n:"Vegetables · 150g",q:"broccoli, beans or peppers"}]},
    {id:"fairlife",time:"15h30",title:"Fairlife shake",badge:"protected · never cut",tone:"gold",items:[
      {id:"shake",n:"Fairlife Nutrition Plan · chocolate",q:"150 kcal · 30g protein"},
      {id:"crea1",n:"Creatine 5g · scoop 1 of 2",q:"shake it in"},
      {id:"cleanse1",n:"Daily Cleanse · scoop 1 of 2",q:"8g soluble fiber"}]},
    {id:"dinner",time:"18h00",title:"Dinner · plate, round 2",badge:ROTATION[dow].kcal+" kcal today",tone:"green",note:ROTATION[dow].note,items:[
      {id:"protein2",n:ROTATION[dow].p,q:"today's rotation protein, cooked weight"},
      {id:"rice2",n:"Jasmine rice · 125g cooked",q:"same batch as lunch"},
      {id:"veg2",n:dow===1?"Vegetables · 150g (no EVOO today)":"Vegetables · 150g + EVOO 1 tsp",q:dow===1?"sockeye brings its own fat":"the teaspoon lives here"}]},
    {id:"casein",time:"19h45",title:"Casein window",badge:"closes 20h00 · 47g P",tone:"green",items:[
      {id:"yogurt",n:"Greek yogurt 0% · 200g",q:"casein base · overnight amino release"},
      {id:"iso2",n:"VRAC ISO · 1 scoop, stirred in",q:"same tub as the morning bowl"},
      {id:"crea2",n:"Creatine 5g · scoop 2 of 2",q:"stirs invisibly in"},
      {id:"cleanse2",n:"Daily Cleanse · scoop 2 of 2",q:"overnight fiber"},
      ...(training?[{id:"bluebN",n:"Frozen blueberries · 40g",q:"training days only · dropped in frozen"}]:[])]},
  ];
}

/* ===================== storage (on this device) ===================== */
const pad=n=>String(n).padStart(2,"0");
const keyFor=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>keyFor(new Date());
const LS_OK=(()=>{try{localStorage.setItem("alfa:test","1");localStorage.removeItem("alfa:test");return true}catch(e){return false}})();
function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(e){return fb}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

let dateKey=todayKey();
let day=load("alfa:day:"+dateKey,{items:{},water:0,training:false,notes:""});
let log=load("alfa:log",{weights:[],days:{}});
let tab="today", confirmReset=false, closedBanner=false;

function persist(){
  save("alfa:day:"+dateKey,day);
  const items=buildMeals(new Date(dateKey+"T12:00:00").getDay(),day.training).flatMap(m=>m.items.map(i=>i.id));
  const done=items.filter(id=>day.items[id]).length;
  log.days[dateKey]={pct:items.length?Math.round(done/items.length*100):0,water:day.water,training:day.training};
  save("alfa:log",log);
}

/* roll to a new day if the app stayed open past midnight */
function rollDay(){
  const k=todayKey();
  if(k!==dateKey){dateKey=k;day=load("alfa:day:"+dateKey,{items:{},water:0,training:false,notes:""});render();}
}
setInterval(()=>{rollDay();renderStatus();},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){rollDay();render();}});

/* ===================== helpers ===================== */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtDate(d){return d.toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"})}
function windowState(){
  const n=new Date(),h=n.getHours()+n.getMinutes()/60;
  if(h<8)return{cls:"fast",label:"Fasted · window opens 08h00"};
  if(h<20){const left=20-h;return{cls:"open",label:`Window open · closes 20h00 · ${Math.floor(left)}h${pad(Math.round((left%1)*60))} left`}}
  return{cls:"closed",label:"Kitchen closed · 20h00 has passed"};
}
function stats(){
  const meals=buildMeals(new Date().getDay(),day.training);
  const ids=meals.flatMap(m=>m.items.map(i=>i.id));
  const done=ids.filter(id=>day.items[id]).length;
  return{meals,ids,done,pct:ids.length?Math.round(done/ids.length*100):0};
}

/* ===================== actions ===================== */
window.setTab=t=>{tab=t;render();window.scrollTo(0,0)};
window.toggleTraining=()=>{day.training=!day.training;persist();render()};
window.toggleItem=id=>{
  day.items[id]=!day.items[id];persist();
  const s=stats();
  if(s.done===s.ids.length&&s.ids.length){closedBanner=true;setTimeout(()=>{closedBanner=false;render()},2600)}
  render();
};
window.setWater=i=>{day.water=(day.water===i+1)?i:i+1;persist();render()};
window.saveNotes=v=>{day.notes=v;persist()};
window.saveWeight=()=>{
  const el=document.getElementById("wIn");const w=parseFloat(el.value);
  if(!w||w<80||w>500){el.focus();return}
  log.weights=[...log.weights.filter(x=>x.d!==dateKey),{d:dateKey,w}].sort((a,b)=>a.d<b.d?-1:1);
  save("alfa:log",log);el.value="";render();
};
window.askReset=v=>{confirmReset=v;render()};
window.resetAll=()=>{
  Object.keys(localStorage).filter(k=>k.startsWith("alfa:")).forEach(k=>localStorage.removeItem(k));
  day={items:{},water:0,training:false,notes:""};log={weights:[],days:{}};confirmReset=false;render();
};
function backupJSON(){
  const out={};Object.keys(localStorage).filter(k=>k.startsWith("alfa:")).forEach(k=>{out[k]=localStorage.getItem(k)});
  return JSON.stringify({app:"alfa-daddy-tracker",version:"11.0",exported:new Date().toISOString(),data:out},null,0);
}
window.downloadBackup=()=>{
  const blob=new Blob([backupJSON()],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`alfa-daddy-backup-${todayKey()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
};
window.copyBackup=async()=>{
  const btn=document.getElementById("copyBtn");
  try{await navigator.clipboard.writeText(backupJSON());btn.textContent="Copied"}catch(e){btn.textContent="Copy blocked, use download"}
  setTimeout(()=>{btn.textContent="Copy backup"},1800);
};
window.importBackup=()=>{
  const ta=document.getElementById("importIn");const msg=document.getElementById("importMsg");
  try{
    const obj=JSON.parse(ta.value.trim());const data=obj.data||obj;let n=0;
    Object.keys(data).forEach(k=>{if(k.startsWith("alfa:")){localStorage.setItem(k,data[k]);n++}});
    if(!n)throw new Error("no keys");
    day=load("alfa:day:"+dateKey,{items:{},water:0,training:false,notes:""});log=load("alfa:log",{weights:[],days:{}});
    msg.textContent=`Restored ${n} entries.`;ta.value="";setTimeout(render,900);
  }catch(e){msg.textContent="That did not look like an Alfa Daddy backup. Paste the whole file content."}
};
window.importFile=ev=>{
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{document.getElementById("importIn").value=r.result;importBackup()};r.readAsText(f);
};

/* ===================== render ===================== */
function renderStatus(){const el=document.getElementById("status");if(!el)return;const w=windowState();el.className="status "+w.cls;el.textContent=w.label}

function header(s){
  const dash=(s.pct/100*150.8).toFixed(1);
  return `<div class="hero">
    <div class="row">
      <div><div class="brand">ALFA DADDY</div><div class="brandsub">v11.0 · clean carb cut · ${esc(fmtDate(new Date()))}</div></div>
      <div class="ring"><svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="5"/>
        <circle class="fg" cx="28" cy="28" r="24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="${dash} 150.8" transform="rotate(-90 28 28)"/>
      </svg><div class="pct">${s.pct}%</div></div>
    </div>
    <button class="toggle ${day.training?"on":""}" onclick="toggleTraining()"><span class="lbl">${day.training?"Training day":"Rest day"}</span><span class="knob"></span></button>
    <div class="hint">${day.training?"Bottle 4 opens at 15h30 · 40g blueberries allowed in the casein window":"3 bottles today · the casein window stays berry free"}</div>
  </div>`;
}

function todayView(s){
  const w=windowState();
  let h="";
  if(!LS_OK)h+=`<div class="status closed">This browser is blocking on-device storage (private mode?). Today works, but nothing is saved.</div>`;
  if(closedBanner)h+=`<div class="banner">Day closed clean · every box in · see you at 08h00</div>`;
  h+=`<div id="status" class="status ${w.cls}">${esc(w.label)}</div>`;
  for(const m of s.meals){
    const done=m.items.every(i=>day.items[i.id]);
    h+=`<div class="card ${done?"done":""}"><div class="chead"><span class="tpill">${m.time}</span><span class="ttl">${esc(m.title)}</span><span class="badge ${m.tone}">${esc(m.badge)}</span></div>`;
    if(m.note)h+=`<div class="note">${esc(m.note)}</div>`;
    h+=`<div class="items">`;
    for(const it of m.items){
      const on=!!day.items[it.id];
      h+=`<button class="item ${on?"on":""}" onclick="toggleItem('${it.id}')"><span class="box">${on?"✓":""}</span><span><span class="n">${esc(it.n)}</span><span class="q">${esc(it.q)}</span></span></button>`;
    }
    h+=`</div></div>`;
  }
  const goal=day.training?8:6;
  h+=`<div class="card"><div class="sec"><div class="between"><h3>Water gauge</h3><span style="font-size:13px;font-weight:700;color:var(--sky)">${(day.water/2).toFixed(1)}L of ${goal/2}L</span></div>
    <div class="sub">Tap to fill · 1 by 12h00 · 1.5 by 14h30 · 2 by 16h00 · 2.5 by 18h30 · 3 by 20h00</div><div class="water">`;
  for(let i=0;i<goal;i++)h+=`<button class="seg ${i<day.water?"on":""} ${i>=6?"train":""}" onclick="setWater(${i})" aria-label="half litre ${i+1}"></button>`;
  h+=`</div></div></div>`;
  const last=log.weights[log.weights.length-1];
  const delta=log.weights.length>=2?(last.w-log.weights[0].w):null;
  h+=`<div class="card"><div class="sec"><h3>Weekly weigh-in</h3><div class="sub">Same day, same conditions: on wake, after the bathroom, before food or water.</div>
    <div class="rowg"><input id="wIn" class="field" type="number" inputmode="decimal" step="0.1" placeholder="Weight in lb"><button class="btn primary" onclick="saveWeight()">Log it</button></div>
    ${last?`<div class="small">Last: ${last.w} lb on ${last.d}${delta!==null?` <b style="color:${delta<=0?"var(--forest)":"var(--clay)"}">· ${delta>0?"+":""}${delta.toFixed(1)} lb since start</b>`:""}</div>`:""}
  </div></div>`;
  h+=`<div class="card"><div class="sec"><h3>Day notes</h3><textarea id="notes" class="field" style="margin-top:8px" placeholder="Hunger, energy, the gym, anything worth remembering…" oninput="saveNotes(this.value)">${esc(day.notes||"")}</textarea></div></div>`;
  h+=`<div class="pin">08h00 bowl · 12h30 plate · 15h30 Fairlife · 18h00 plate · 19h45 casein · 20h00 closed · 3L in</div>`;
  return h;
}

function weightChart(ws){
  const W=420,H=120,p=8;const vals=ws.map(x=>x.w);const min=Math.min(...vals)-1,max=Math.max(...vals)+1;
  const x=i=>p+(i/(ws.length-1))*(W-2*p), y=v=>p+(1-(v-min)/(max-min))*(H-2*p);
  const d=ws.map((pt,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(pt.w).toFixed(1)}`).join(" ");
  const dots=ws.map((pt,i)=>`<circle cx="${x(i)}" cy="${y(pt.w)}" r="4" fill="#0c5a44"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px;margin-top:8px"><path d="${d}" fill="none" stroke="#147a5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}
    <text x="${p}" y="${y(ws[0].w)-8}" font-size="11" fill="#71807a">${ws[0].w}</text>
    <text x="${x(ws.length-1)-4}" y="${y(ws[ws.length-1].w)-8}" font-size="11" fill="#0c5a44" font-weight="700" text-anchor="end">${ws[ws.length-1].w}</text></svg>`;
}

function progressView(){
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=keyFor(d);days.push({k,...(log.days[k]||{pct:0,water:0})})}
  const ws=log.weights.slice(-12);
  let h=`<div class="card"><div class="sec"><div class="between"><h3>Weight</h3><span class="sub">target pace 1.6 to 1.9 lb/week</span></div>`;
  h+=ws.length>=2?weightChart(ws):`<div class="sub" style="padding:18px 0;font-size:13px">Log two weigh-ins and the curve appears here. One per week is the rule; the trend is the signal, the single number is just noise.</div>`;
  if(log.weights.length){h+=`<div class="wlist" style="margin-top:6px">`;log.weights.slice(-5).reverse().forEach(w=>{h+=`<div><span style="color:var(--sub)">${w.d}</span><b>${w.w} lb</b></div>`});h+=`</div>`}
  h+=`</div></div>`;
  h+=`<div class="card"><div class="sec"><h3>Last 14 days · boxes checked</h3><div class="bars">`;
  days.forEach(d=>{h+=`<div title="${d.k} · ${d.pct}%" style="height:${Math.max(d.pct,3)}%;background:${d.pct===100?"var(--forest)":d.pct>0?"var(--jade2)":"var(--line)"}"></div>`});
  h+=`</div><div class="axis"><span>${days[0].k.slice(5)}</span><span>today</span></div></div></div>`;
  h+=`<div class="card"><div class="sec"><h3>Water · last 14 days</h3><div class="bars" style="height:56px">`;
  days.forEach(d=>{const g=d.training?8:6;h+=`<div title="${d.k} · ${(d.water||0)/2}L" style="height:${Math.min((d.water||0)/8*100,100)}%;min-height:2px;background:${(d.water||0)>=g?"var(--sky)":"#a9c4dd"}"></div>`});
  h+=`</div></div></div>`;
  h+=`<div class="card"><div class="sec"><h3>Backup</h3><div class="sub">Everything lives on this device only. Back up before changing phones or clearing the browser.</div>
    <div class="rowg"><button class="btn primary" onclick="downloadBackup()">Download backup</button><button id="copyBtn" class="btn ghost" onclick="copyBackup()">Copy backup</button></div>
    <div class="sub" style="margin-top:12px">Restore: paste a backup below, or pick the file.</div>
    <textarea id="importIn" class="field mono" style="margin-top:8px" placeholder='{"app":"alfa-daddy-tracker", ...}'></textarea>
    <div class="rowg"><button class="btn ghost" onclick="importBackup()">Restore from paste</button><label class="btn ghost" style="display:inline-flex;align-items:center">Pick file<input type="file" accept="application/json,.json" style="display:none" onchange="importFile(event)"></label></div>
    <div id="importMsg" class="small"></div></div></div>`;

function render(){
  const s=stats();
  document.getElementById("app").innerHTML=header(s)+(tab==="today"?todayView(s):progressView());
  document.getElementById("tabToday").className=tab==="today"?"act":"";
  document.getElementById("tabProgress").className=tab==="progress"?"act":"";
}

  return{meals,ids:all.map(i=>i.id),done:done.length,total:all.length,pct:all.length?Math.round(done.length/all.length*100):0,kcal:sum(done,"kcal"),p:sum(done,"p"),planKcal:sum(all,"kcal"),planP:sum(all,"p")};
}
function nowHour(){const n=new Date();return n.getHours()+n.getMinutes()/60}
function windowState(){
  const h=nowHour();
  if(h<8)return{cls:"fast",label:"Fasted · window opens 08h00"};
  if(h<19){const left=20-h;return{cls:"open",label:`Window open · closes 20h00 · ${Math.floor(left)}h${pad(Math.round((left%1)*60))} left`}}
  if(h<20){const m=Math.round((20-h)*60);return{cls:"late",label:`Kitchen closes in ${m} min · casein window is now`}}
  return{cls:"closed",label:"Kitchen closed · 20h00 has passed"};
}
function nowNext(meals){
  const h=nowHour();const order=meals.map(m=>({...m,t:MEAL_TIMES[m.id]}));
  let cur=null,nxt=null;for(const m of order){if(m.t<=h)cur=m;else if(!nxt)nxt=m}
  const isDone=m=>m.items.every(i=>day.items[i.id]);
  if(cur&&!isDone(cur)){const left=cur.items.filter(i=>!day.items[i.id]).length;return{k:"Now",v:`${cur.time} · ${cur.title}`,s:`${left} of ${cur.items.length} boxes still open`,id:cur.id}}
  if(nxt){const d=nxt.t-h;const s=d>=1?`in ${Math.floor(d)}h${pad(Math.round((d%1)*60))}`:`in ${Math.round(d*60)} min`;return{k:"Next",v:`${nxt.time} · ${nxt.title}`,s,id:nxt.id}}
  if(h>=20)return{k:"Closed",v:"Kitchen closed",s:"Everything logged. Sleep is the last supplement.",id:null};
  return{k:"Now",v:"All caught up",s:"Nothing open right now",id:null};
}
function waterExpected(h){const cp=[[12,2],[14.5,3],[16,4],[18.5,5],[20,6]];let e=0;for(const[t,n]of cp)if(h>=t)e=n;return e}
function weekInfo(){
  if(!settings.startDate)return null;
  const days=Math.floor((parseKey(dateKey)-parseKey(settings.startDate))/86400000);
  if(days<0)return null;const wk=Math.floor(days/7)+1;
  let flag="";if(wk===9||wk===19)flag="blood work next week · stop B-complex 3 days before";else if(wk===10||wk===20)flag="blood work week";
  return{wk,flag};
}
function streaks(){
  const keys=Object.keys(log.days).sort();if(!keys.length)return{cur:0,best:0};
  let best=0,run=0,prev=null;
  for(const k of keys){const ok=log.days[k].pct===100;const cont=prev&&(parseKey(k)-parseKey(prev))/86400000===1;run=ok?(cont?run+1:1):0;if(run>best)best=run;prev=k}
  let cur=0;const d=new Date();if(!(log.days[keyFor(d)]&&log.days[keyFor(d)].pct===100))d.setDate(d.getDate()-1);
  while(log.days[keyFor(d)]&&log.days[keyFor(d)].pct===100){cur++;d.setDate(d.getDate()-1)}
  return{cur,best};
}
function pace(){
  const ws=log.weights;if(ws.length<2)return null;
  const last=ws[ws.length-1];const cutoff=parseKey(last.d);cutoff.setDate(cutoff.getDate()-35);
  let first=ws.find(w=>parseKey(w.d)>=cutoff)||ws[0];if(first===last)first=ws[ws.length-2];
  const weeks=(parseKey(last.d)-parseKey(first.d))/604800000;if(weeks<=0)return null;
  const perWeek=(first.w-last.w)/weeks;
  let cls="ok",text=`On pace: ${perWeek.toFixed(1)} lb/week, right in the 1.6 to 1.9 band.`;
  if(perWeek<1.2){cls="slow";text=`${perWeek.toFixed(1)} lb/week, under the band. Two flat weeks triggers the push lever: rice to 100g at both plates, never the protein.`}
  else if(perWeek<1.6){cls="slow";text=`${perWeek.toFixed(1)} lb/week, a touch under the band. Hold the line one more week before touching a lever.`}
  else if(perWeek>2.3){cls="fast";text=`${perWeek.toFixed(1)} lb/week, faster than planned. Watch hunger and gym strength; the add back lever (half avocado at dinner) is there if either dips.`}
  let eta=null;const goal=parseFloat(settings.goalWeight);
  if(goal&&perWeek>0&&last.w>goal){const d=parseKey(last.d);d.setDate(d.getDate()+Math.round((last.w-goal)/perWeek*7));eta=d}
  return{perWeek,cls,text,eta,last};
}

function weightChart(ws){

  let min=Math.min(...vals),max=Math.max(...vals);if(goal&&goal>min-15)min=Math.min(min,goal);min-=1;max+=1;if(max-min<4){max+=2;min-=2}
  const x=i=>p+(i/Math.max(ws.length-1,1))*(W-2*p), y=v=>p+(1-(v-min)/(max-min))*(H-2*p);
  const d=ws.map((pt,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(pt.w).toFixed(1)}`).join(" ");
  const dots=ws.map((pt,i)=>`<circle cx="${x(i)}" cy="${y(pt.w)}" r="4" fill="var(--forest)"/>`).join("");
  const goalLine=goal&&goal>=min&&goal<=max?`<line x1="${p}" x2="${W-p}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-p}" y="${y(goal)-5}" font-size="10" fill="var(--gold)" text-anchor="end">goal ${goal}</text>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:140px;margin-top:8px">${goalLine}<path d="${d}" fill="none" stroke="var(--jade)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}
    <text x="${p}" y="${y(ws[0].w)-8}" font-size="11" fill="var(--sub)">${ws[0].w}</text>
    <text x="${x(ws.length-1)-4}" y="${y(ws[ws.length-1].w)-8}" font-size="11" fill="var(--forest)" font-weight="700" text-anchor="end">${ws[ws.length-1].w}</text></svg>`;
}
function heatmap(){

function progressView(){

  h+=`<div class="card"><div class="sec"><div class="between"><h3>Weight</h3><span class="sub">target pace ${PLAN.paceLow} to ${PLAN.paceHigh} lb/week</span></div>`;
  h+=ws.length>=2?weightChart(ws):`<div class="sub" style="padding:18px 0;font-size:13px">Log two weigh-ins and the curve appears here. One per week is the rule; the trend is the signal, the single number is just noise.</div>`;
  if(pc){h+=`<div class="verdict ${pc.cls}">${esc(pc.text)}${pc.eta?` At this pace you reach ${esc(settings.goalWeight)} lb around <b>${esc(pc.eta.toLocaleDateString("en-CA",{month:"long",day:"numeric",year:"numeric"}))}</b>.`:""}</div>`}
  if(log.weights.length){h+=`<div class="wlist" style="margin-top:8px">`;log.weights.slice(-6).reverse().forEach(w=>{h+=`<div><span style="color:var(--sub)">${w.d}</span><b>${w.w} lb${w.waist?` <span style="color:var(--sub);font-weight:400">· ${w.waist} in</span>`:""}</b></div>`});h+=`</div>`}
  h+=`</div></div>`;
  h+=`<div class="card"><div class="sec"><h3>Calendar</h3><div class="sub">Tap a day to open it. Dark green is a 100% day.</div>${heatmap()}</div></div>`;
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=keyFor(d);days.push({k,...(log.days[k]||{pct:0,water:0})})}
  h+=`<div class="card"><div class="sec"><h3>Water · last 14 days</h3><div class="bars" style="height:56px">`;
  days.forEach(d=>{const g=d.training?8:6;h+=`<div title="${d.k} · ${(d.water||0)/2}L" style="height:${Math.min((d.water||0)/8*100,100)}%;min-height:2px;background:${(d.water||0)>=g?"var(--sky)":"var(--skyfill)"}"></div>`});
  h+=`</div><div class="axis"><span>${days[0].k.slice(5)}</span><span>today</span></div></div></div>`;
  return h;
}

/* ===================== render: shop ===================== */
function shopView(){
  const total=SHOP.reduce((a,s)=>a+s.items.length,0);const done=SHOP.reduce((a,s)=>a+s.items.filter(i=>shop.items[i[0]]).length,0);
  let h=`<div class="nowcard"><div><div class="k">Weekly list</div><div class="v">${done} of ${total} in the cart</div><div class="s">list started ${esc(shop.since)} · scaled from the plan, 7 days</div></div><button class="cta" onclick="newWeek()">New week</button></div>`;
  for(const s of SHOP){h+=`<div class="card"><div class="sec"><h3>${esc(s.store)}</h3><div style="margin-top:6px">`;
    for(const[id,n,q]of s.items){const on=!!shop.items[id];h+=`<button class="item ${on?"on":""}" style="padding:6px 4px" onclick="toggleShop('${id}')"><span class="box">${on?"✓":""}</span><span style="min-width:0"><span class="n">${esc(n)}</span><span class="q">${esc(q)}</span></span></button>`}
    h+=`</div></div></div>`}
  h+=`<div class="card"><div class="sec"><h3>Sunday prep</h3><div class="sub">Ninety minutes on Sunday buys a week of zero decisions.</div><div style="margin-top:6px">`;
  for(const[id,n,q]of PREP){const on=!!shop.prep[id];h+=`<button class="item ${on?"on":""}" style="padding:6px 4px" onclick="togglePrep('${id}')"><span class="box">${on?"✓":""}</span><span style="min-width:0"><span class="n">${esc(n)}</span><span class="q">${esc(q)}</span></span></button>`}
  h+=`</div></div></div>`;
  return h;
}

/* ===================== render: plan ===================== */
function planView(){
  const products=[["Eggs, large","70 kcal · 6g P each"],["Blueberries","42 kcal per ½ cup"],["Greek yogurt 0%, 200g","110 kcal · 20g P"],["Fairlife Nutrition Plan chocolate","150 kcal · 30g P"],["Chicken breast, 185g cooked","305 kcal · 57g P"],["Sockeye salmon, 185g cooked","~340 kcal · 47g P"],["Lean beef, 185g cooked","~340 kcal · 54g P"],["Pork loin centre cut, 185g cooked","~320 kcal · 54g P"],["Shrimp, 185g cooked","~185 kcal · 38g P"],["Jasmine rice, 125g cooked","162 kcal · 35g C"],["Vegetables, 150g","~40 kcal"],["Kirkland EVOO, 1 tsp","40 kcal · 4.5g F"],["VRAC ISO dark chocolate, 30g scoop","~115 kcal · 27g P"],["Elev8 Creamy Rice, 40g scoop","117 kcal · 26g C"],["Daily Cleanse, 1 scoop","60 kcal · 8g fiber"]];
  return `<div class="card"><div class="sec" style="padding-bottom:6px"><h3>Alfa Daddy Diet v11.0 · the protocol</h3><div class="sub">~1,960 kcal · ~240g protein · ~136g net carbs · ~38g fat · deficit ~790 to 940 · 1.6 to 1.9 lb/week</div></div>
  <details open><summary>The day in one line</summary><div class="dbody">08h00 bowl · 12h30 plate · 15h30 Fairlife · 18h00 plate · 19h45 casein · 20h00 closed · 3L in</div></details>
  <details><summary>The fourteen rules</summary><div class="dbody">${RULES.map((r,i)=>`<div class="rule"><span class="num">${i+1}</span><span><b>${esc(r[0])}</b> ${esc(r[1])}</span></div>`).join("")}</div></details>
  <details><summary>The math and the levers</summary><div class="dbody">Maintenance sits near 2,750 to 2,900 kcal. Intake lands at ~1,850 to 2,015 depending on the dinner protein (weekly average ~1,960), a daily deficit of ~790 to 940 kcal, about 1.6 to 1.9 lb per week at 3,500 kcal per pound. Protein holds at ~240g, roughly 1.2g per pound and climbing as the scale drops.
    <div class="lever push"><b>Push lever</b> · want ~2.0 lb/week? Rice to 100g cooked at both plates (~65 kcal/day). The only approved push; the meals never disappear.</div>
    <div class="lever back"><b>Add back lever</b> · hunger or gym performance dips? Half an avocado returns at dinner (+120 kcal) or rice goes to 150g at both plates (+65). Add back fat or carbs; protein never needed the help.</div></div></details>
  <details><summary>Stall protocol</summary><div class="dbody">Two consecutive flat weeks (under 0.5 lb total): pull the push lever, rice to 100g at both plates. Two more flat weeks: add a 20 minute walk after dinner before touching food again. Protein and the Fairlife are never part of any stall response. If the stall survives all of that, the next move is a diet review, not a starvation move.</div></details>
  <details><summary>Supplements and hydration</summary><div class="dbody">Wake: Synthroid 150mcg alone, 30 to 60 min before food. Wake + 45: personal compounds per your separate protocol. 15h30: creatine 5g (1 of 2), Daily Cleanse (1 of 2), the B12/B6 scoop is optional (keto era leftover). 19h45: creatine 5g (2 of 2), Daily Cleanse (2 of 2). Blood work at weeks 10 and 20; stop B-complex 3 days before each draw.<br><br>Water: 1L per bottle. 1 by 12h00 · 1.5 by 14h30 · 2 by 16h00 · 2.5 by 18h30 · 3 by 20h00. Training days add a 4th bottle from 15h30.</div></details>
  <details><summary>Product sheet</summary><div class="dbody">${products.map(([a,b])=>`<div class="shoprow"><span>${esc(a)}</span><span class="pm">${esc(b)}</span></div>`).join("")}<div class="small">Swap rule: any product can be replaced by an equivalent with the same macros and the same job.</div></div></details>
  </div>`;
}

/* ===================== render: settings ===================== */
function settingsView(){
  const dayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  let h=`<div class="card"><div class="sec"><h3>Your cut</h3><div class="sub">Powers the week counter, the blood work alerts and the goal line.</div>
    <div class="grid2"><div><label class="lbl">Start date</label><input class="field" type="date" value="${esc(settings.startDate)}" onchange="setSetting('startDate',this.value)"></div>
    <div><label class="lbl">Weigh-in day</label><select class="field" onchange="setSetting('weighDay',Number(this.value))">${dayNames.map((n,i)=>`<option value="${i}" ${Number(settings.weighDay)===i?"selected":""}>${n}</option>`).join("")}</select></div>
    <div><label class="lbl">Start weight (lb)</label><input class="field" type="number" inputmode="decimal" value="${esc(settings.startWeight)}" onchange="setSetting('startWeight',this.value)"></div>
    <div><label class="lbl">Goal weight (lb)</label><input class="field" type="number" inputmode="decimal" value="${esc(settings.goalWeight)}" onchange="setSetting('goalWeight',this.value)"></div></div>
  </div></div>`;
  h+=`<div class="card"><div class="sec"><h3>Reminders in your Calendar</h3><div class="sub">Each button downloads a calendar file. Open it and tap Add All; your phone then handles the alerts natively, even when this app is closed. Do this once from Safari rather than from the home screen icon.</div>
    <div class="rowg"><button class="btn primary" onclick="icsMeals()">Meals + 20h00 close</button><button class="btn ghost" onclick="icsWater()">Water checkpoints</button><button class="btn ghost" onclick="icsWeigh()">Weekly weigh-in</button></div></div></div>`;
  h+=`<div class="card"><div class="sec"><h3>Backup and export</h3><div class="sub">Everything lives on this device only. Back up before changing phones or clearing the browser.</div>
    <div class="rowg"><button class="btn primary" onclick="downloadBackup()">Download backup</button><button class="btn ghost" onclick="copyBackup()">Copy backup</button><button class="btn ghost" onclick="exportCSV()">Export CSV for Excel</button></div>
    <div class="sub" style="margin-top:12px">Restore: paste a backup below, or pick the file.</div>
    <textarea id="importIn" class="field mono" style="margin-top:8px" placeholder='{"app":"alfa-daddy-tracker", ...}'></textarea>
    <div class="rowg"><button class="btn ghost" onclick="importBackup()">Restore from paste</button><label class="btn ghost" style="display:inline-flex;align-items:center">Pick file<input type="file" accept="application/json,.json" style="display:none" onchange="importFile(event)"></label></div></div></div>`;
  h+=`<div class="card"><div class="sec"><h3>About</h3><div class="sub">Alfa Daddy Tracker ${APP_VERSION} · companion to the Alfa Daddy Diet v11.0 · ${esc(swState)} · follows your phone's light or dark mode</div>
    ${confirmReset?`<div class="rowg"><button class="btn dangerfill" onclick="resetAll()">Yes, erase everything</button><button class="btn ghost" onclick="askReset(false)">Keep it</button></div>`:`<div class="rowg"><button class="btn danger" onclick="askReset(true)">Erase all data</button></div>`}
  </div></div>`;
  return h;
}

/* ===================== render ===================== */
const TABS=[["today","Today","◉"],["progress","Progress","▲"],["shop","Shop","▣"],["plan","Plan","≡"]];
function render(){
  const s=statsFor(day,new Date().getDay());
  const view=tab==="today"?todayView(s):tab==="progress"?progressView():tab==="shop"?shopView():tab==="plan"?planView():settingsView();
  document.getElementById("app").innerHTML=header(s)+view+(toastMsg?`<div class="toast">${esc(toastMsg)}</div>`:"");
  document.getElementById("nav").innerHTML=TABS.map(([id,l,ic])=>`<button class="${tab===id?"act":""}" onclick="setTab('${id}')"><span>${ic}</span>${l}</button>`).join("");
}

/* ===================== offline (service worker) ===================== */
if("serviceWorker"in navigator&&location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./sw.js").then(()=>{swState="offline ready";if(tab==="settings")render()}).catch(()=>{swState="offline cache unavailable"});
}
render();
</script>
